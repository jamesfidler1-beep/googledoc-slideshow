<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="100%" height="100%">
  <style>
    .bg {
      fill: #000000;
    }
    .chevron {
      fill: none;
      stroke: #ffffff;
      stroke-width: 6;
      stroke-linecap: square;
      stroke-linejoin: miter;
      stroke-miterlimit: 4;
      opacity: 0;
      animation: moveAndFade 2s infinite ease-in-out;
    }
    .chv-1 { animation-delay: 0.0s; }
    .chv-2 { animation-delay: 0.2s; }
    .chv-3 { animation-delay: 0.4s; }

    @keyframes moveAndFade {
      0% {
        transform: translateX(-20px);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      70% {
        opacity: 1;
      }
      100% {
        transform: translateX(20px);
        opacity: 0;
      }
    }
  </style>
  
  <!-- Black Background -->
  <rect class="bg" width="100%" height="100%" />
  
  <!-- Moving Chevrons Group -->
  <g transform="translate(60, 0)">
    <!-- Chevron 1 -->
    <path class="chevron chv-1" d="M 20,30 L 40,50 L 20,70" />
    <!-- Chevron 2 -->
    <path class="chevron chv-2" d="M 40,30 L 60,50 L 40,70" />
    <!-- Chevron 3 -->
    <path class="chevron chv-3" d="M 60,30 L 80,50 L 60,70" />
  </g>
</svg>